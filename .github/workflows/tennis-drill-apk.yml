name: Build Tennis Drill V2 APK

on:
  push:
    branches:
      - chatgpt/tennis-drill-v2
    paths:
      - "TennisDrillV1/**"
      - ".github/workflows/tennis-drill-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: TennisDrillV1
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp TennisDrillV1/app/build/outputs/apk/debug/app-debug.apk TennisDrill-V2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TennisDrill-V2-APK
          path: TennisDrill-V2-debug.apk
          retention-days: 30
